<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Low-Poly 3D Studio 🎨✨</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #ff6584;
    --accent-hover: #ff476d;
    --accent-gradient: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
    --bg: #fff5f8;
    --card-bg: #ffffff;
    --border: #ffd6e0;
    --text-color: #4a2b33;
    --user-bubble: linear-gradient(135deg, #ff6584 0%, #ff859d 100%);
    --shadow: 0 8px 24px rgba(255, 101, 132, 0.12);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Nunito', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-color);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 1rem 1.5rem;
    box-shadow: 0 4px 15px rgba(255, 101, 132, 0.25);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-brand {
    display: flex;
    flex-direction: column;
  }

  .header-title {
    font-family: 'Fredoka', cursive, sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .header-subtitle {
    font-size: 0.9rem;
    opacity: 0.95;
    margin-top: 0.1rem;
    font-weight: 600;
  }

  .dialogue-trigger-btn {
    background: #ffffff;
    color: var(--accent);
    border: 2px solid #ffffff;
    border-radius: 20px;
    padding: 0.5rem 1.1rem;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 0.4rem;
    transition: all 0.2s ease;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .dialogue-trigger-btn:hover {
    background: #ffe3e9;
    color: var(--accent-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.15);
  }

  .quick-prompts {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    padding: 0.8rem 1rem;
    background: #ffedf2;
    border-bottom: 2px dashed var(--border);
    flex-wrap: wrap;
  }

  .pill {
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 20px;
    padding: 0.4rem 0.9rem;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.85rem;
    color: #d84364;
    cursor: pointer;
    transition: all 0.2s ease;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,0.03);
  }

  .pill:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(255, 101, 132, 0.3);
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
  }

  .msg { margin: 1rem 0; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user { text-align: right; }

  .bubble {
    display: inline-block;
    padding: 0.9rem 1.2rem;
    border-radius: 20px;
    background: var(--card-bg);
    border: 2px solid var(--border);
    text-align: left;
    max-width: 88%;
    white-space: pre-wrap;
    box-shadow: var(--shadow);
    font-size: 1rem;
    line-height: 1.5;
  }

  .msg.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border: none;
    border-bottom-right-radius: 4px;
    font-weight: 700;
  }

  .msg.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  .formatted-text a {
    display: inline-block;
    padding: 0.5rem 0.9rem;
    margin: 0.3rem 0;
    background: #fff;
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 12px;
    text-decoration: none;
    font-weight: 800;
    transition: all 0.2s ease;
  }

  .formatted-text a:hover {
    background: var(--accent);
    color: #fff;
    transform: scale(1.02);
    box-shadow: 0 4px 12px rgba(255, 101, 132, 0.3);
  }

  .formatted-text code {
    background: #ffe3e9;
    color: #c7254e;
    padding: 0.2rem 0.4rem;
    border-radius: 6px;
    font-family: monospace;
    font-size: 0.9rem;
  }

  form {
    display: flex;
    gap: 0.8rem;
    padding: 1.2rem;
    border-top: 2px solid var(--border);
    background: #ffffff;
    box-shadow: 0 -4px 20px rgba(255, 101, 132, 0.08);
  }

  input {
    flex: 1;
    padding: 0.9rem 1.2rem;
    border: 2px solid var(--border);
    border-radius: 16px;
    font-size: 1.05rem;
    font-family: 'Nunito', sans-serif;
    color: var(--text-color);
    outline: none;
    transition: border-color 0.2s ease;
  }

  input:focus {
    border-color: var(--accent);
  }

  button.send-btn {
    padding: 0.9rem 1.6rem;
    border: none;
    border-radius: 16px;
    background: var(--accent-gradient);
    color: #fff;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(255, 101, 132, 0.3);
  }

  button.send-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(255, 101, 132, 0.45);
  }

  /* --- Cute Dialogue Modal Layout --- */
  .dialogue-overlay {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(74, 43, 51, 0.45);
    backdrop-filter: blur(8px);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.25s ease;
  }

  .dialogue-overlay.active {
    display: flex;
  }

  .dialogue-card {
    background: #ffffff;
    border: 3px solid var(--border);
    border-radius: 28px;
    width: 90%;
    max-width: 520px;
    padding: 1.8rem;
    box-shadow: 0 20px 50px rgba(255, 101, 132, 0.3);
    position: relative;
    animation: slideUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .dialogue-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px dashed var(--border);
    padding-bottom: 0.9rem;
    margin-bottom: 1.2rem;
  }

  .dialogue-title {
    font-family: 'Fredoka', cursive, sans-serif;
    font-size: 1.4rem;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .dialogue-close {
    background: #ffedf2;
    color: var(--accent);
    border: none;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .dialogue-close:hover {
    background: var(--accent);
    color: #ffffff;
    transform: rotate(90deg);
  }

  .dialogue-body {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .dialogue-field {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .dialogue-label {
    font-family: 'Fredoka', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-color);
  }

  .dialogue-select, .dialogue-input {
    padding: 0.7rem 1rem;
    border: 2px solid var(--border);
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    outline: none;
  }

  .color-picker-row {
    display: flex;
    gap: 1rem;
  }

  .color-picker-group {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    background: #fff5f8;
    padding: 0.5rem 0.8rem;
    border-radius: 14px;
    border: 2px solid var(--border);
  }

  .color-picker-group input[type="color"] {
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    cursor: pointer;
    background: transparent;
    padding: 0;
  }

  .dialogue-footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.8rem;
    margin-top: 1.4rem;
  }

  .btn-cancel {
    background: #ffedf2;
    color: #d84364;
    border: 2px solid var(--border);
    border-radius: 14px;
    padding: 0.7rem 1.2rem;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .btn-cancel:hover {
    background: #ffd6e0;
  }

  .btn-submit {
    background: var(--accent-gradient);
    color: #ffffff;
    border: none;
    border-radius: 14px;
    padding: 0.7rem 1.4rem;
    font-family: 'Fredoka', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 101, 132, 0.3);
    transition: all 0.2s ease;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(255, 101, 132, 0.45);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 1.2rem;
    background: #fff;
    box-shadow: var(--shadow);
    max-width: 100%;
  }

  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.5rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.4; }
  .a2text.a2-h1 { font-family: 'Fredoka', sans-serif; font-size: 1.6rem; font-weight: 700; color: var(--accent); }
  .a2text.a2-h2 { font-family: 'Fredoka', sans-serif; font-size: 1.3rem; font-weight: 700; }
  .a2text.a2-h3 { font-size: 1.1rem; font-weight: 700; }
  .a2text.a2-caption { font-size: 0.88rem; color: #885f69; }
  .a2divider { border: none; border-top: 2px dashed var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 14px; display: block; }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.3rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="header-title">Low-Poly 3D Studio 🎨✨</div>
    <div class="header-subtitle">Procedural 3D Model & Asset Generator</div>
  </div>
  <button class="dialogue-trigger-btn" onclick="openDialogue()">
    ⚙️ Studio Dialogue
  </button>
</header>

<div class="quick-prompts">
  <button class="pill" onclick="sendQuick('Generate a low poly pine tree')">🌲 Low-Poly Tree</button>
  <button class="pill" onclick="sendQuick('Generate a low poly crystal cluster')">💎 Crystal Gem</button>
  <button class="pill" onclick="sendQuick('Generate a low poly cozy house')">🏠 Cozy House</button>
  <button class="pill" onclick="sendQuick('Generate a low poly granite rock')">🪨 Granite Rock</button>
</div>

<div id="log"></div>

<form id="form">
  <input id="input" placeholder="Describe a 3D model to generate (e.g. crystal, tree, house, rock)…" autocomplete="off" autofocus>
  <button class="send-btn">Generate ✨</button>
</form>

<!-- Custom Cute Studio Dialogue Modal -->
<div id="dialogueModal" class="dialogue-overlay" onclick="closeDialogueOnBackdrop(event)">
  <div class="dialogue-card">
    <div class="dialogue-header">
      <div class="dialogue-title">🎨 Custom 3D Model Settings</div>
      <button class="dialogue-close" onclick="closeDialogue()">✕</button>
    </div>
    <div class="dialogue-body">
      <div class="dialogue-field">
        <label class="dialogue-label">Model Type</label>
        <select id="diagType" class="dialogue-select">
          <option value="tree">🌲 Low-Poly Tree</option>
          <option value="crystal">💎 Crystal Cluster</option>
          <option value="house">🏠 Cozy House / Cabin</option>
          <option value="rock">🪨 Granite Rock / Boulder</option>
        </select>
      </div>
      <div class="dialogue-field">
        <label class="dialogue-label">Output Model Name</label>
        <input id="diagName" class="dialogue-input" placeholder="e.g. emerald_crystal" value="custom_3d_asset">
      </div>
      <div class="dialogue-field">
        <label class="dialogue-label">Colors</label>
        <div class="color-picker-row">
          <div class="color-picker-group">
            <input type="color" id="diagColorPrimary" value="#2e8b57">
            <span class="dialogue-label">Primary</span>
          </div>
          <div class="color-picker-group">
            <input type="color" id="diagColorSecondary" value="#8b4513">
            <span class="dialogue-label">Secondary</span>
          </div>
        </div>
      </div>
    </div>
    <div class="dialogue-footer">
      <button class="btn-cancel" onclick="closeDialogue()">Cancel</button>
      <button class="btn-submit" onclick="submitDialogue()">✨ Generate Model</button>
    </div>
  </div>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const dialogueModal = document.getElementById("dialogueModal");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

function sendQuick(promptText) {
  input.value = promptText;
  form.dispatchEvent(new Event("submit"));
}

/* --- Dialogue Modal Functions --- */
function openDialogue() {
  dialogueModal.classList.add("active");
}

function closeDialogue() {
  dialogueModal.classList.remove("active");
}

function closeDialogueOnBackdrop(event) {
  if (event.target === dialogueModal) closeDialogue();
}

function submitDialogue() {
  const type = document.getElementById("diagType").value;
  const name = document.getElementById("diagName").value.trim() || "custom_asset";
  const primary = document.getElementById("diagColorPrimary").value;
  const secondary = document.getElementById("diagColorSecondary").value;

  const promptText = `Generate a ${type} model named "${name}" with primary color ${primary} and secondary color ${secondary}.`;
  closeDialogue();
  sendQuick(promptText);
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer & text parser
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderTextWithFormattedHtml(container, text) {
  const d = el("div", "formatted-text");
  let formatted = text
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*(.*?)\*\*/g, "<b>$1</b>");

  d.innerHTML = formatted;
  container.appendChild(d);
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) renderTextWithFormattedHtml(b, textStr);

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) renderTextWithFormattedHtml(b, flattenText(a2ui) || "(no card content)");
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
